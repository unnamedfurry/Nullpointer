syntax = "proto3";
package fnb;

option go_package = "dev.c0redev/femboynetwork/proto";

service BinaryService {
    rpc GetBinary(BinaryRequest) returns (stream BinaryChunk);
}

message BinaryRequest {
    string arch = 1;
    uint32 proto_version = 2;
}

message BinaryChunk {
    bytes data = 1;
    uint32 offset = 2;
    uint32 total_size = 3;
    bool is_last = 4;
}
